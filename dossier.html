  <template id="tpl-idea"><h2>Small Coq. Big Dreams.</h2><p>QUQN est un personnage meme natif de Bitcoin : un petit coq avec une ambition complètement disproportionnée. L’univers sert à créer une identité, une histoire et une culture communautaire reconnaissables — pas une promesse de richesse.</p><div class="links"><a href="index.html#story">RENCONTRER QUQN →</a><a href="index.html#chapters">VOIR LES PERSONNAGES →</a></div></template>
  <template id="tpl-bitcoin"><h2>Bitcoin est le réseau. BRC-20 est le format.</h2><p>QUQN est déployé sur Bitcoin mainnet sous la forme d’un ticker BRC-20 classique 4 caractères. Le site QUQN informe et oriente : il ne conserve pas de fonds, n’exécute pas lui-même le mint et ne demande jamais la phrase de récupération du wallet.</p><div class="links"><a href="https://uniscan.cc/brc20/QUQN" target="_blank" rel="noopener">VÉRIFIER SUR UNISCAN ↗</a><a href="index.html#how">VOIR THE BASICS →</a></div></template>
  <template id="tpl-fair"><h2>Mêmes règles publiques.</h2><p>Le modèle retenu pour QUQN est un fair mint : pas de prévente, pas d’ICO, pas de vente primaire par le projet et pas de frais de mint créateur. Les frais éventuels du réseau Bitcoin ou des services tiers restent externes à QUQN.</p><div class="links"><a href="legal.html#mica" target="_blank" rel="noopener">NOTE LÉGALE / MICA ↗</a><a href="index.html#how">GUIDE DE MINT →</a></div></template>
  <template id="tpl-token"><h2>L’empreinte publique.</h2><div class="facts"><span><small>TICKER</small><strong>QUQN</strong></span><span><small>NETWORK</small><strong>Bitcoin</strong></span><span><small>FORMAT</small><strong>BRC-20</strong></span><span><small>MAX SUPPLY</small><strong>21,000,000</strong></span><span><small>PER MINT</small><strong>1,000</strong></span><span><small>INSCRIPTION</small><strong>#127329518</strong></span></div><div class="links"><a href="https://uniscan.cc/brc20/QUQN" target="_blank" rel="noopener">OUVRIR UNISCAN ↗</a><a href="index.html#inscription-log">OUVRIR LE LOG →</a></div></template>
  <template id="tpl-universe"><h2>QUQN est le premier chapitre.</h2><p>NBRO et MRKO sont les deux personnages destinés à rejoindre progressivement l’histoire. Le projet peut développer des scènes, des memes, des PFP, des votes créatifs et une archive communautaire sans transformer ces fonctions en droits financiers.</p><div class="links"><a href="index.html#chapters">VOIR LES CHAPITRES →</a><a href="index.html#quqn-lab">OUVRIR QUQN LAB →</a><a href="index.html#ranks">VOIR THE COOP →</a></div><p class="risk">QUQN est expérimental et spéculatif. Aucun prix, rendement, niveau de liquidité ou cotation future n’est promis.</p></template>
