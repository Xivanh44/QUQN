<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="robots" content="noindex">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>QUQN</title>
  <script>
    (function(){
      var key=(location.hash||'').replace('#','');
      var allowed=['idea','bitcoin','fair','token','universe'];
      var target='index.html#quqn-dossier';
      if(allowed.indexOf(key)!==-1){
        target='index.html?dossier='+encodeURIComponent(key)+'#quqn-dossier';
      }
      location.replace(target);
    })();
  </script>
</head>
<body></body>
</html>
